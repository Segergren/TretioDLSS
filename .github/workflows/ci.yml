name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Frontend/package-lock.json

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Frontend install
        working-directory: Frontend
        run: npm ci

      - name: Frontend lint
        working-directory: Frontend
        run: npm run lint

      - name: Frontend build
        working-directory: Frontend
        run: npm run build

      - name: Build
        run: dotnet build TretioDLSS.sln -c Release

      # Hosted runners have no GPU or display: those tests carry Category=Gpu.
      - name: Test
        run: dotnet test TretioDLSS.sln -c Release --no-build --filter "Category!=Gpu"
